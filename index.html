<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #2F2F2F, #6A0DAD);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    h1 { color: #6A0DAD; }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #6A0DAD;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #4B0082; }

    .watermark {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome 💜</h1>
    <p>Start your journey by logging in.</p>
    <button onclick="goLogin()">Login</button>
  </main>

  <div class="watermark">Developed by Aruna.</div>

  <script>
    function goLogin() { window.location.href = "login.html"; }
  </script>
</body>
</html>
