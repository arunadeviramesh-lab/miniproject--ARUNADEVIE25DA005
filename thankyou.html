<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #2F2F2F, #6A0DAD);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .card {
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 15px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      color: #6A0DAD;
      margin-bottom: 20px;
      font-size: 28px;
    }

    p {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #6A0DAD;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4B0082;
      transform: scale(1.05);
    }

    .info {
      margin-top: 25px;
      text-align: center;
      width: 80%;
      max-width: 500px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 💜 THIS IS THE FIX */
    .info p {
      color: #FFFFFF;
      font-size: 14px;
    }

    /* 💜 WATERMARK */
    .watermark {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Thank You 💜</h1>
    <p>Your decorated lines are saved beautifully. Come back soon!</p>

    <button onclick="goHome()">Back to Welcome</button>
  </main>

  <div class="info">
    <p><strong>About Me:</strong> I am a student interested in web design and creativity. This project reflects my effort to combine simple technology with aesthetic presentation.</p>

    <p><strong>Contact Me:</strong> arunadeviramesh09@gmail.com</p>
  </div>

  <div class="watermark">Developed by Aruna.</div>

  <script>
    function goHome() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
